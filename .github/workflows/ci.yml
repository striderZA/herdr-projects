# Runs the whole check (`npm run check -- --all`: build, made tables, the repo's rules, every test) on Linux and on
# Windows, on every pull request and on every push to master, unless a change is only docs (the Markdown at the top,
# docs/, LICENSE, assets/): the board runs this check before each pull request, so a docs change does not run it here.
# The runner images come with Rust and Node.js.
name: Check

on:
  push:
    branches: [master]
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - 'LICENSE'
      - 'assets/**'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - 'LICENSE'
      - 'assets/**'

# The git identity for the commits the check makes.
env:
  GIT_AUTHOR_NAME: ci
  GIT_AUTHOR_EMAIL: ci@example.com
  GIT_COMMITTER_NAME: ci
  GIT_COMMITTER_EMAIL: ci@example.com

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - name: Cache the build
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: check-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: check-${{ runner.os }}-

      - name: The check
        run: npm run check -- --all
