# The board's first crate: its data (store/), herdr and the agents, and the small tools every part uses.
# Which crate holds what, and why: docs/crates.md.
[package]
name = "sw-core"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "sw_core"

[dependencies]
chrono.workspace = true
crossterm.workspace = true
fancy-regex.workspace = true
libc.workspace = true
ratatui.workspace = true
regex.workspace = true
serde.workspace = true
serde_json.workspace = true
sha1_smol.workspace = true
toml.workspace = true
unicode-segmentation.workspace = true
unicode-width.workspace = true

# Windows only: the Win32 calls of the platform layer (crates/core/src/platform/) and NTFS junctions for linked folders.
# Nothing here is built on Unix.
[target.'cfg(windows)'.dependencies]
junction = "2.1"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis", "Win32_Networking_WinSock", "Win32_Storage_FileSystem", "Win32_System_Console", "Win32_System_IO", "Win32_System_JobObjects", "Win32_System_Pipes", "Win32_System_Threading"] }
