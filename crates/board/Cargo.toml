# The board's screen, on sw-flow: its state, what a key does, and what it draws (board/).
# Which crate holds what, and why: docs/crates.md.
[package]
name = "sw-board"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "sw_board"

[dependencies]
sw-flow.workspace = true
crossterm.workspace = true
libc.workspace = true
ratatui.workspace = true
regex.workspace = true
serde_json.workspace = true
unicode-segmentation.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_IO", "Win32_System_Threading"] }
