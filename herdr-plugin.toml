id = "herdr-projects"
name = "Projects"
version = "1.2.8"
# The oldest herdr this plugin was actually verified on.
min_herdr_version = "0.9.3"
description = "A work board: one list of tasks, each delegated one an ordinary herdr agent in its own space"
platforms = ["linux", "macos"]

# Commands go through bin/run.sh: herdr starts them with its server's environment, which may lack the user's PATH. It
# runs the program built here, or the one downloaded for this platform from this version's GitHub release.

# Gets the program when the plugin is installed: downloads it, or builds it from source when it cannot.
[[build]]
command = ["sh", "bin/run.sh", "--fetch"]

[[startup]]
command = ["sh", "bin/run.sh", "hook"]

[[actions]]
id = "open"
title = "Open the work board"
command = ["sh", "bin/run.sh", "open"]

[[actions]]
id = "coordinator"
title = "Go into the Coordinator's chat"
command = ["sh", "bin/run.sh", "open-coordinator"]

[[actions]]
id = "approve-current"
title = "Approve the task in the focused pane (the board asks first)"
contexts = ["pane"]
command = ["sh", "bin/run.sh", "approve-current"]

[[events]]
on = "pane.agent_status_changed"
command = ["sh", "bin/run.sh", "hook"]

# An agent exiting to its shell fires this (released) on herdr 0.9.3.
[[events]]
on = "pane.agent_detected"
command = ["sh", "bin/run.sh", "hook"]

[[events]]
on = "pane.closed"
command = ["sh", "bin/run.sh", "hook"]

[[events]]
on = "worktree.removed"
command = ["sh", "bin/run.sh", "hook"]

# Windows invokes the downloaded executable directly; each action id is distinct across platforms.
[[build]]
platforms = ["windows"]
command = ["powershell", "-NoProfile", "-ExecutionPolicy", "Bypass", "-File", "bin/run.ps1", "--fetch"]

[[startup]]
platforms = ["windows"]
command = ["powershell", "-NoProfile", "-ExecutionPolicy", "Bypass", "-File", "bin/run.ps1", "hook"]

[[actions]]
id = "open-windows"
platforms = ["windows"]
title = "Open the work board"
command = ["powershell", "-NoProfile", "-ExecutionPolicy", "Bypass", "-Command", '''$b=$env:HERDR_BIN_PATH; if(-not $b){$b='herdr'}; $p=((& $b plugin list --json|ConvertFrom-Json).result.plugins|?{$_.plugin_id -eq 'herdr-projects'}).plugin_root; if($p -and $p.StartsWith('\\?\')){$p=$p.Substring(4)}; & (Join-Path (Join-Path $p 'bin') 'run.ps1') open''']

[[actions]]
id = "coordinator-windows"
platforms = ["windows"]
title = "Go into the Coordinator's chat"
command = ["powershell", "-NoProfile", "-ExecutionPolicy", "Bypass", "-Command", '''$b=$env:HERDR_BIN_PATH; if(-not $b){$b='herdr'}; $p=((& $b plugin list --json|ConvertFrom-Json).result.plugins|?{$_.plugin_id -eq 'herdr-projects'}).plugin_root; if($p -and $p.StartsWith('\\?\')){$p=$p.Substring(4)}; & (Join-Path (Join-Path $p 'bin') 'run.ps1') open-coordinator''']

[[actions]]
id = "approve-current-windows"
platforms = ["windows"]
title = "Approve the task in the focused pane (the board asks first)"
contexts = ["pane"]
command = ["powershell", "-NoProfile", "-ExecutionPolicy", "Bypass", "-Command", '''$b=$env:HERDR_BIN_PATH; if(-not $b){$b='herdr'}; $p=((& $b plugin list --json|ConvertFrom-Json).result.plugins|?{$_.plugin_id -eq 'herdr-projects'}).plugin_root; if($p -and $p.StartsWith('\\?\')){$p=$p.Substring(4)}; & (Join-Path (Join-Path $p 'bin') 'run.ps1') approve-current''']

[[events]]
platforms = ["windows"]
on = "pane.agent_status_changed"
command = ["powershell", "-NoProfile", "-ExecutionPolicy", "Bypass", "-File", "bin/run.ps1", "hook"]

[[events]]
platforms = ["windows"]
on = "pane.agent_detected"
command = ["powershell", "-NoProfile", "-ExecutionPolicy", "Bypass", "-File", "bin/run.ps1", "hook"]

[[events]]
platforms = ["windows"]
on = "pane.closed"
command = ["powershell", "-NoProfile", "-ExecutionPolicy", "Bypass", "-File", "bin/run.ps1", "hook"]

[[events]]
platforms = ["windows"]
on = "worktree.removed"
command = ["powershell", "-NoProfile", "-ExecutionPolicy", "Bypass", "-File", "bin/run.ps1", "hook"]

[[panes]]
id = "board"
title = "Work board"
# A tab of its own unless you choose the popup (`board.open`): the board key then opens this pane as herdr's popup
# instead, a window over everything (src/board/run/place.rs).
placement = "tab"
command = ["sh", "bin/run.sh", "board"]
